# One ONNX Runtime for the whole app: sherpa-onnx's static build (fetched by
# `pnpm native`), which `ort` (Parakeet, Smart Turn, emotion2vec) links against too.
[env]
ORT_LIB_LOCATION = { value = "vendor/native/lib", relative = true }
SHERPA_ONNX_LIB_DIR = { value = "vendor/native/lib", relative = true }

# sherpa-onnx's Windows libraries use the static C runtime (/MT), so the app does too.
# Bonus: users don't need the Visual C++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
