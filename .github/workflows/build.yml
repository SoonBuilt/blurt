# Builds Blurt's installers. Public repo, so GitHub Actions minutes are free.
#
# Run it by hand (Actions -> build -> Run workflow) for a test build, or push a
# `v*` tag to build and attach the installers to a draft GitHub release.
#
# Apple Silicon only on the Mac side: ONNX Runtime (which runs the speech model) has no
# prebuilt binaries for x86_64-apple-darwin, so an Intel Mac build would mean compiling
# ONNX Runtime from source. Every Mac sold since 2020 is Apple Silicon.
name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust_target }}

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Blurt {0}', github.ref_name) || '' }}
          releaseDraft: true

      # The Store copy: Blurt's own files, taken out of the MSI and wrapped as an .msix that the
      # Microsoft Store signs. Upload it in Partner Center (Blurt - Voice Typing > Packages).
      - name: Build Microsoft Store package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1
          $x = Join-Path $env:RUNNER_TEMP "blurt-msi"
          $p = Start-Process msiexec -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$x`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed ($($p.ExitCode))" }
          $exe = Get-ChildItem $x -Recurse -Filter Blurt.exe | Select-Object -First 1
          $v = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          ./store/make-msix.ps1 -AppDir $exe.DirectoryName -Exe $exe.Name `
            -Name Soonbuilt.Blurt-VoiceTyping -DisplayName "Blurt - Voice Typing" `
            -Description "Hold a key and talk. Blurt types what you say wherever your cursor is." `
            -Version $v -Logo src-tauri\icons\icon.png -Microphone `
            -Out "src-tauri\target\release\bundle\msix\Blurt-$v-store.msix"

      - name: Keep installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blurt-${{ matrix.rust_target }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/msix/*.msix
          if-no-files-found: error
